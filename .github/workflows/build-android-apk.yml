name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "app/**"
      - "public/**"
      - "assets/android-icon/**"
      - "capacitor.config.ts"
      - "next.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: pnpm install --frozen-lockfile
      - run: pnpm android:init
      - name: Apply launcher icon
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "assets/android-icon/${density}.png" "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp "assets/android-icon/${density}.png" "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      - run: pnpm android:sync
      - run: ./gradlew assembleDebug
        working-directory: android

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk SomeHours.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SomeHours-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish installable APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-build-${GITHUB_RUN_NUMBER}" SomeHours.apk \
            --target "${GITHUB_SHA}" \
            --title "SomeHours Android build ${GITHUB_RUN_NUMBER}" \
            --notes "Installable debug-signed APK generated from commit ${GITHUB_SHA}."
